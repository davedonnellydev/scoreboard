<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="score-board">
                <h3>HOME</h3>
                <div id="home-board" class="score"><span id="home-score"></span></div>
                <div class="score-buttons">
                    <button onclick="homePlus(1)">+1</button>
                    <button onclick="homePlus(2)">+2</button>
                    <button onclick="homePlus(3)">+3</button>
                </div>
            </div>
            <div class="score-board">
                <h3>AWAY</h3>
                <div id="guest-board" class="score"><span id="guest-score"></span></div>
                <div class="score-buttons">
                    <button onclick="guestPlus(1)">+1</button>
                    <button onclick="guestPlus(2)">+2</button>
                    <button onclick="guestPlus(3)">+3</button>
                </div>
            </div>
        </div>
        <button id="new-game" onclick="newGame()">NEW GAME</button>
        <script src="index.js"></script>
    </body>
</html>
